<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Notatnik</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B2FC9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notatnik">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --border: #E2E0D8;
    --border2: #C8C5BB;
    --text: #1A1917;
    --text2: #6B6860;
    --text3: #A8A59E;
    --accent: #3B2FC9;
    --accent-light: #EEEDFE;
    --danger: #C0392B;
    --danger-light: #FDECEA;
    --font: 'IBM Plex Sans', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
    --radius: 10px;
    --header-h: 56px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--text); -webkit-tap-highlight-color: transparent; }

  /* ── VIEWS ── */
  #view-list, #view-note, #view-edit { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); transition: transform 0.25s cubic-bezier(.4,0,.2,1); }
  #view-note  { transform: translateX(100%); }
  #view-edit  { transform: translateX(100%); }
  #view-list.active  { transform: translateX(0); }
  #view-note.active  { transform: translateX(0); }
  #view-edit.active  { transform: translateX(0); }
  #view-list.slide-left { transform: translateX(-30%); }

  /* ── HEADER ── */
  .hdr { height: var(--header-h); min-height: var(--header-h); display: flex; align-items: center; padding: 0 16px; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .hdr-title { flex: 1; font-size: 17px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-sub { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .btn-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; background: transparent; cursor: pointer; color: var(--text2); font-size: 20px; flex-shrink: 0; }
  .btn-icon:active { background: var(--border); }
  .btn-text { height: 36px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-family: var(--font); font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-text:active { background: var(--accent-light); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:active { background: #2d24a0; }

  /* ── SEARCH ── */
  .search-wrap { padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-wrap input { width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-family: var(--font); font-size: 14px; color: var(--text); outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap { position: relative; }
  .search-icon { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 16px; pointer-events: none; }

  /* ── NOTE LIST ── */
  #note-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .note-item { display: flex; align-items: center; padding: 13px 16px; background: var(--surface); border-bottom: 1px solid var(--border); cursor: pointer; gap: 12px; }
  .note-item:active { background: var(--bg); }
  .note-item-body { flex: 1; min-width: 0; }
  .note-item-title { font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .note-item-meta { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .note-item-preview { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .note-item-chevron { color: var(--border2); font-size: 18px; }
  .note-item-del { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: none; background: var(--danger-light); color: var(--danger); font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .note-item-del:active { background: #f5c6c2; }

  /* ── EMPTY STATE ── */
  #empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 60%; color: var(--text3); }
  #empty-state svg { opacity: .35; }
  #empty-state p { font-size: 14px; }

  /* ── NOTE VIEW ── */
  #note-content-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 20px 18px; }
  #note-view-title { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
  #note-view-date { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-bottom: 18px; }
  #note-view-body { font-size: 15px; line-height: 1.75; color: var(--text); white-space: pre-wrap; word-break: break-word; }

  /* ── EDIT VIEW ── */
  #edit-form { flex: 1; display: flex; flex-direction: column; padding: 14px 16px; gap: 10px; overflow-y: auto; }
  #edit-title { width: 100%; padding: 10px 12px; font-family: var(--font); font-size: 17px; font-weight: 600; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); outline: none; }
  #edit-title:focus { border-color: var(--accent); }
  #edit-body { flex: 1; width: 100%; min-height: 300px; padding: 12px; font-family: var(--font); font-size: 15px; line-height: 1.75; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); outline: none; resize: none; }
  #edit-body:focus { border-color: var(--accent); }

  /* ── FAB ── */
  #fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); border: none; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 16px rgba(59,47,201,.35); z-index: 10; }
  #fab:active { background: #2d24a0; transform: scale(0.95); }

  /* ── TOAST ── */
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1A1917; color: #fff; font-size: 13px; padding: 8px 18px; border-radius: 20px; opacity: 0; transition: all .25s; pointer-events: none; white-space: nowrap; z-index: 100; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── CONFIRM MODAL ── */
  #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: flex-end; justify-content: center; padding-bottom: 20px; }
  #modal-overlay.open { display: flex; }
  #modal-box { background: var(--surface); border-radius: 16px; width: calc(100% - 32px); max-width: 400px; overflow: hidden; }
  #modal-box .modal-title { padding: 18px 18px 6px; font-size: 16px; font-weight: 600; }
  #modal-box .modal-body { padding: 0 18px 18px; font-size: 14px; color: var(--text2); }
  #modal-box .modal-btns { display: flex; border-top: 1px solid var(--border); }
  #modal-box .modal-btns button { flex: 1; padding: 14px; border: none; background: transparent; font-family: var(--font); font-size: 15px; cursor: pointer; }
  #modal-box .modal-btns button:first-child { color: var(--text2); border-right: 1px solid var(--border); }
  #modal-box .modal-btns button:last-child { color: var(--danger); font-weight: 500; }
  #modal-box .modal-btns button:active { background: var(--bg); }

  .section-header { padding: 8px 16px 4px; font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; background: var(--bg); }

  /* ── MIC ── */
  .textarea-wrap { position: relative; flex: 1; display: flex; flex-direction: column; }
  #edit-body { flex: 1; padding-bottom: 52px !important; }
  #mic-btn { position: absolute; bottom: 10px; right: 10px; width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(59,47,201,.3); transition: background .2s, transform .15s; z-index: 5; }
  #mic-btn:active { transform: scale(0.93); }
  #mic-btn.recording { background: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(192,57,43,.5); } 50% { box-shadow: 0 0 0 10px rgba(192,57,43,0); } }
  #mic-label { text-align: center; font-size: 11px; color: var(--text3); padding: 4px 0 0; min-height: 16px; }
  #mic-label.active { color: var(--danger); font-weight: 500; }
</style>
</head>
<body>

<!-- LIST VIEW -->
<div id="view-list" class="active">
  <div class="hdr">
    <span class="hdr-title">Notatki</span>
    <span class="hdr-sub" id="note-count"></span>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="search-input" placeholder="Szukaj notatek…" autocomplete="off" />
  </div>
  <div id="note-list"></div>
  <button id="fab" onclick="openNew()" aria-label="Nowa notatka">＋</button>
</div>

<!-- NOTE VIEW -->
<div id="view-note">
  <div class="hdr">
    <button class="btn-icon" onclick="backToList()" aria-label="Wróć">←</button>
    <span class="hdr-title" id="view-note-hdr"></span>
    <button class="btn-icon" onclick="openEdit()" aria-label="Edytuj" style="font-size:18px">✏️</button>
    <button class="btn-icon" onclick="confirmDelete()" aria-label="Usuń" style="color:var(--danger)">🗑</button>
  </div>
  <div id="note-content-wrap">
    <div id="note-view-title"></div>
    <div id="note-view-date"></div>
    <div id="note-view-body"></div>
  </div>
</div>

<!-- EDIT VIEW -->
<div id="view-edit">
  <div class="hdr">
    <button class="btn-text" onclick="cancelEdit()">Anuluj</button>
    <span style="flex:1"></span>
    <button class="btn-text btn-primary" onclick="saveNote()">Zapisz</button>
  </div>
  <div id="edit-form">
    <input id="edit-title" type="text" placeholder="Tytuł notatki…" maxlength="120" />
    <div class="textarea-wrap">
      <textarea id="edit-body" placeholder="Treść notatki…"></textarea>
      <button id="mic-btn" onclick="toggleMic()" aria-label="Dyktuj">🎤</button>
    </div>
    <div id="mic-label"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- CONFIRM MODAL -->
<div id="modal-overlay">
  <div id="modal-box">
    <div class="modal-title">Usuń notatkę?</div>
    <div class="modal-body">Tej operacji nie można cofnąć.</div>
    <div class="modal-btns">
      <button onclick="closeModal()">Anuluj</button>
      <button onclick="deleteNote()">Usuń</button>
    </div>
  </div>
</div>

<script>
  let notes = [];
  let currentId = null;
  let editingId = null;

  const STORAGE_KEY = 'notatnik_v1';

  function load() {
    try { notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { notes = []; }
  }
  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }
  function fmtDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'przed chwilą';
    if (diff < 3600000) return Math.floor(diff/60000) + ' min temu';
    if (d.toDateString() === now.toDateString()) return 'dziś ' + d.toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit'});
    const yest = new Date(now); yest.setDate(yest.getDate()-1);
    if (d.toDateString() === yest.toDateString()) return 'wczoraj ' + d.toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('pl-PL', {day:'2-digit',month:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit'});
  }
  function preview(text) {
    return (text || '').replace(/\n/g,' ').trim().slice(0, 80);
  }

  function renderList(filter) {
    const q = (filter || '').toLowerCase().trim();
    const el = document.getElementById('note-list');
    const sorted = [...notes].sort((a,b) => b.updated - a.updated);
    const filtered = q ? sorted.filter(n => n.title.toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q)) : sorted;

    document.getElementById('note-count').textContent = notes.length ? notes.length + ' notatek' : '';

    if (!filtered.length) {
      el.innerHTML = '<div id="empty-state"><svg width="48" height="48" fill="none" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" stroke="#888" stroke-width="1.5"/><line x1="8" y1="8" x2="16" y2="8" stroke="#888" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="12" x2="16" y2="12" stroke="#888" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="16" x2="12" y2="16" stroke="#888" stroke-width="1.5" stroke-linecap="round"/></svg><p>' + (q ? 'Brak wyników' : 'Brak notatek — dodaj pierwszą') + '</p></div>';
      return;
    }

    el.innerHTML = filtered.map(n => `
      <div class="note-item" onclick="openNote('${n.id}')">
        <div class="note-item-body">
          <div class="note-item-title">${esc(n.title || '(bez tytułu)')}</div>
          <div class="note-item-meta">${fmtDate(n.updated)}</div>
          ${n.body ? '<div class="note-item-preview">' + esc(preview(n.body)) + '</div>' : ''}
        </div>
        <span class="note-item-chevron">›</span>
      </div>
    `).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function openNote(id) {
    currentId = id;
    const n = notes.find(x => x.id === id);
    if (!n) return;
    document.getElementById('view-note-hdr').textContent = n.title || '(bez tytułu)';
    document.getElementById('note-view-title').textContent = n.title || '(bez tytułu)';
    document.getElementById('note-view-date').textContent = 'Ostatnia edycja: ' + fmtDate(n.updated);
    document.getElementById('note-view-body').textContent = n.body || '';
    showView('note');
  }

  function backToList() {
    showView('list');
    renderList(document.getElementById('search-input').value);
  }

  function openNew() {
    editingId = null;
    document.getElementById('edit-title').value = '';
    document.getElementById('edit-body').value = '';
    showView('edit');
    setTimeout(() => document.getElementById('edit-title').focus(), 300);
  }

  function openEdit() {
    const n = notes.find(x => x.id === currentId);
    if (!n) return;
    editingId = n.id;
    document.getElementById('edit-title').value = n.title || '';
    document.getElementById('edit-body').value = n.body || '';
    showView('edit');
    setTimeout(() => document.getElementById('edit-body').focus(), 300);
  }

  function cancelEdit() {
    if (editingId) { showView('note'); }
    else { showView('list'); renderList(); }
  }

  function saveNote() {
    const title = document.getElementById('edit-title').value.trim();
    const body = document.getElementById('edit-body').value;
    if (!title && !body.trim()) { toast('Wpisz tytuł lub treść'); return; }
    const now = Date.now();
    if (editingId) {
      const n = notes.find(x => x.id === editingId);
      n.title = title || '(bez tytułu)';
      n.body = body;
      n.updated = now;
    } else {
      notes.push({ id: uid(), title: title || '(bez tytułu)', body, created: now, updated: now });
    }
    save();
    toast('Zapisano');
    if (editingId) {
      currentId = editingId;
      openNote(currentId);
    } else {
      showView('list');
      renderList();
    }
  }

  function confirmDelete() {
    document.getElementById('modal-overlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }
  function deleteNote() {
    notes = notes.filter(x => x.id !== currentId);
    save();
    closeModal();
    toast('Usunięto notatkę');
    showView('list');
    renderList();
  }

  function showView(name) {
    document.getElementById('view-list').classList.remove('active','slide-left');
    document.getElementById('view-note').classList.remove('active');
    document.getElementById('view-edit').classList.remove('active');
    if (name === 'list') {
      document.getElementById('view-list').classList.add('active');
    } else if (name === 'note') {
      document.getElementById('view-list').classList.add('slide-left');
      document.getElementById('view-note').classList.add('active');
    } else if (name === 'edit') {
      document.getElementById('view-list').classList.add('slide-left');
      document.getElementById('view-edit').classList.add('active');
    }
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }

  document.getElementById('search-input').addEventListener('input', function() {
    renderList(this.value);
  });

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // Android back button support
  window.addEventListener('popstate', function() {
    const noteActive = document.getElementById('view-note').classList.contains('active');
    const editActive = document.getElementById('view-edit').classList.contains('active');
    if (editActive) { cancelEdit(); history.pushState(null, ''); }
    else if (noteActive) { backToList(); history.pushState(null, ''); }
  });
  history.pushState(null, '');

  // ── SPEECH RECOGNITION ──
  let recognition = null;
  let isRecording = false;

  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = 'pl-PL';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    let finalText = '';

    r.onstart = () => {
      isRecording = true;
      finalText = document.getElementById('edit-body').value;
      document.getElementById('mic-btn').classList.add('recording');
      document.getElementById('mic-btn').textContent = '⏹';
      document.getElementById('mic-label').textContent = 'Słucham… (naciśnij ⏹ aby zatrzymać)';
      document.getElementById('mic-label').classList.add('active');
    };

    r.onresult = (e) => {
      let interim = '';
      let final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      if (final) {
        finalText += (finalText && !finalText.endsWith(' ') && !finalText.endsWith('\n') ? ' ' : '') + final;
      }
      document.getElementById('edit-body').value = finalText + (interim ? ' ' + interim : '');
    };

    r.onerror = (e) => {
      stopMic();
      if (e.error === 'not-allowed') toast('Brak zgody na mikrofon');
      else if (e.error === 'no-speech') toast('Nie wykryto mowy');
      else toast('Błąd mikrofonu: ' + e.error);
    };

    r.onend = () => { if (isRecording) stopMic(); };
    return r;
  }

  function toggleMic() {
    if (isRecording) { stopMic(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast('Twoja przeglądarka nie obsługuje dyktowania'); return; }
    recognition = initRecognition();
    if (recognition) recognition.start();
  }

  function stopMic() {
    isRecording = false;
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('mic-btn').textContent = '🎤';
    document.getElementById('mic-label').textContent = '';
    document.getElementById('mic-label').classList.remove('active');
  }

  load();
  renderList();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
